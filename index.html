<!DOCTYPE html>
<!--
  [이 파일은 앱스 스크립트 프로젝트 안에 넣는 화면 파일입니다]
  1. 앱스 스크립트 편집기에서 파일 옆 + → HTML → 이름을 정확히 "index" 로 만들고
     이 내용 전체를 붙여넣으세요.
  2. ★ 로컬에서 더블클릭해도 동작하지 않습니다! (서버 함수를 직접 부르기 때문)
     꼭 앱스 스크립트를 배포하고, 배포 주소(/exec)로 여세요.
  3. 백엔드 주소 설정 같은 것은 필요 없습니다. Code.gs 와 함께 쓰입니다.
-->
<html lang="ko">
<head>
<base target="_top">
<meta charset="UTF-8">
<title>학교 급식 조회</title>
<style>
  :root{
    --main:#f76707; --main-dark:#e8590c; --line:#eee9e2;
    --text:#333; --grey:#888; --bg:#f7f5f2;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font-family:'Apple SD Gothic Neo','Malgun Gothic','맑은 고딕',sans-serif;color:var(--text);background:var(--bg)}
  #wrap{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:#fff;box-shadow:0 0 18px rgba(0,0,0,.06)}

  /* ---------- 헤더 ---------- */
  header{background:linear-gradient(135deg,#ff922b,#f76707);color:#fff;padding:20px 18px 16px}
  header h1{margin:0;font-size:22px;letter-spacing:-.5px}
  #schoolName{font-size:12px;opacity:.92;margin-top:5px}

  /* ---------- 날짜 선택 ---------- */
  #dateRow{display:flex;gap:6px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);background:#fff}
  #dateRow button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 12px;cursor:pointer;font-size:14px;color:var(--text)}
  #dateRow button:hover{background:#fdf3ea;border-color:#ffd8a8}
  #mealDate{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:14px;text-align:center}
  #mealDate:focus{outline:2px solid #ffd8a8}
  #todayBtn{font-weight:700}

  /* ---------- 급식 목록 ---------- */
  #mealBody{flex:1;padding:16px 14px;overflow-y:auto}
  .dayLabel{font-weight:800;font-size:15px;margin:2px 2px 12px}
  .mealCard{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px;background:#fffdf9}
  .mealHead{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
  .mealType{font-weight:800;font-size:15px;color:var(--main-dark)}
  .mealKcal{font-size:12px;color:var(--grey)}
  .mealMenu{font-size:14px;line-height:1.9;white-space:pre-wrap;word-break:keep-all}
  .mealEmpty{color:#999;font-size:14px;text-align:center;padding:60px 10px;line-height:1.7;white-space:pre-line}
  footer{padding:10px;text-align:center;font-size:11px;color:#bbb;border-top:1px solid var(--line)}
</style>
</head>
<body>
<div id="wrap">

  <!-- ===== 헤더 ===== -->
  <header>
    <h1>🍚 학교 급식</h1>
    <div id="schoolName">급식 정보를 불러오면 학교 이름이 표시됩니다</div>
  </header>

  <!-- ===== 날짜 선택 ===== -->
  <div id="dateRow">
    <button id="prevBtn" type="button" title="전날">◀</button>
    <input id="mealDate" type="date">
    <button id="nextBtn" type="button" title="다음 날">▶</button>
    <button id="todayBtn" type="button">오늘</button>
  </div>

  <!-- ===== 급식 목록 ===== -->
  <main id="mealBody"></main>

  <footer>급식 정보 출처: 나이스 개방 API (neis.go.kr)</footer>
</div>

<script>
(function () {
'use strict';

/* ================= 유틸 ================= */
function $(id) { return document.getElementById(id); }
function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function fmtYMD(d) {
  return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
}
function fmtDay(dateStr) {
  var d = new Date(dateStr + 'T00:00:00');
  if (isNaN(d)) return '';
  var days = ['일', '월', '화', '수', '목', '금', '토'];
  return d.getFullYear() + '년 ' + (d.getMonth() + 1) + '월 ' + d.getDate() + '일 (' + days[d.getDay()] + ')';
}
/* 메뉴 뒤의 알레르기 번호 (1.5.6.9) 와 표시용 * 는 화면에서는 지우고 보여줍니다 */
function cleanDish(s) {
  return String(s).replace(/\s*\([\d.,\s]*\)/g, '').replace(/\*+\s*$/, '').trim();
}

/* ================= 급식 조회 ================= */
var seq = 0;   /* ◀▶ 를 빠르게 눌러도 마지막 요청 결과만 반영하기 위한 번호 */
function loadMeal() {
  var date = $('mealDate').value;
  if (!date) return;
  var my = ++seq;
  var body = $('mealBody');
  body.textContent = '';
  body.appendChild(el('div', 'mealEmpty', '급식 정보를 불러오는 중…'));
  google.script.run
    .withSuccessHandler(function (meals) {
      if (my === seq) renderMeal(meals || []);
    })
    .withFailureHandler(function (err) {
      if (my !== seq) return;
      body.textContent = '';
      body.appendChild(el('div', 'mealEmpty',
        '⚠ ' + (err && err.message ? err.message : '급식 정보를 가져오지 못했습니다.') +
        '\n스크립트 속성 NEIS_API_KEY 를 확인하세요.'));
    })
    .getMeals(date);
}

function renderMeal(meals) {
  var body = $('mealBody');
  body.textContent = '';
  if (meals.length && meals[0].school) {
    $('schoolName').textContent = meals[0].school;
  }
  if (!meals.length) {
    body.appendChild(el('div', 'mealEmpty', '이 날은 급식 정보가 없습니다.\n(주말 · 방학 · 휴일)'));
    return;
  }
  body.appendChild(el('div', 'dayLabel', fmtDay($('mealDate').value)));
  meals.forEach(function (m) {
    var card = el('div', 'mealCard');
    var head = el('div', 'mealHead');
    head.appendChild(el('div', 'mealType', m.type || '급식'));
    head.appendChild(el('div', 'mealKcal', m.kcal || ''));
    card.appendChild(head);
    card.appendChild(el('div', 'mealMenu', (m.menu || []).map(cleanDish).join('\n')));
    body.appendChild(card);
  });
}

function shiftMealDay(n) {
  var input = $('mealDate');
  var d = new Date((input.value || fmtYMD(new Date())) + 'T00:00:00');
  d.setDate(d.getDate() + n);
  input.value = fmtYMD(d);
  loadMeal();
}

/* ================= 이벤트 연결 ================= */
$('prevBtn').addEventListener('click', function () { shiftMealDay(-1); });
$('nextBtn').addEventListener('click', function () { shiftMealDay(1); });
$('todayBtn').addEventListener('click', function () {
  $('mealDate').value = fmtYMD(new Date());
  loadMeal();
});
$('mealDate').addEventListener('change', loadMeal);

/* ================= 시작 ================= */
$('mealDate').value = fmtYMD(new Date());
loadMeal();

})();
</script>
</body>
</html>
